name: release

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  linters:
    uses: ./.github/workflows/linters.yml

  publish:
    needs:
      - tests
      - linters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version in plugin.cfg
        run: |
          version=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/gdcrest/plugin.cfg)
          if [ "v$version" != "$TAG" ]; then
            echo "plugin.cfg says $version but the tag is $TAG" >&2
            exit 1
          fi
      - name: Extract the changelog section
        run: |
          awk -v version="${TAG#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
      - name: Build the addon zip
        run: git archive --format=zip -o "gdcrest-$TAG.zip" "$TAG"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "gdcrest-$TAG.zip" --title "gdcrest $TAG" --notes-file "$RUNNER_TEMP/notes.md"
