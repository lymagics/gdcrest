name: release

# Runs when a release is published on GitHub. Publishing creates the tag; this
# workflow only checks the release and attaches the addon zip to it.
on:
  release:
    types:
      - published

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  linters:
    uses: ./.github/workflows/linters.yml

  publish:
    needs:
      - tests
      - linters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version in plugin.cfg
        run: |
          version=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/gdcrest/plugin.cfg)
          if [ "v$version" != "$TAG" ]; then
            echo "plugin.cfg says $version but the release tag is $TAG" >&2
            exit 1
          fi
      - name: Check the changelog
        run: |
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
      - name: Build the addon zip
        run: git archive --format=zip -o "gdcrest-$TAG.zip" "$TAG"
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "gdcrest-$TAG.zip" --clobber
